<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Art sheet</title>
<style>
body{margin:0;padding:16px;background:#bfeee6;font:12px sans-serif;display:flex;flex-wrap:wrap;gap:12px}
figure{margin:0;background:#fff8ee;border-radius:14px;padding:8px;width:150px;text-align:center}
figure img,figure svg{width:134px;height:134px;object-fit:contain;display:block}
figure.big{width:300px}figure.big svg{width:284px;height:250px}
</style></head><body>
<script src="../js/art.js"></script>
<script>
for (const n of Art.names()) document.body.insertAdjacentHTML('beforeend', `<figure>${Art.img(n)}<figcaption>${n}</figcaption></figure>`);
for (const n of ['bowl','blender','ovenBack','doughBall','pizzaBase']) document.body.insertAdjacentHTML('beforeend', `<figure class="big">${Art[n]()}${n==='ovenBack'?'':''}<figcaption>${n}</figcaption></figure>`);
</script></body></html>
