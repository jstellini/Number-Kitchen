<!DOCTYPE html>
<!-- Review page for every piece of art at once. Open via serve.ps1 after running
     `python tools/build_art.py`. -->
<html lang="en-AU"><head><meta charset="utf-8"><title>Art sheet</title>
<style>
  body { margin:0; background:#fff6e6; font-family:system-ui,sans-serif; color:#3b2b20; }
  h1 { text-align:center; padding:16px 0 0; margin:0; }
  h2 { padding:16px 20px 0; margin:0; font-size:17px; opacity:.6; }
  .sheet { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; padding:10px 20px 24px; }
  figure { margin:0; background:#fff; border-radius:16px; padding:10px; text-align:center; box-shadow:0 5px 0 rgba(0,0,0,.1); }
  figure img { width:100%; height:auto; display:block; }
  figcaption { font-size:12px; margin-top:4px; opacity:.7; }
  .vsheet { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; padding:10px 20px 40px; }
  .vsheet figure { padding:12px; }
  .vsheet svg { width:100%; height:auto; display:block; }
</style></head><body>
<h1>Number Kitchen — art</h1>
<h2>Ingredients &amp; portions</h2><div class="sheet" id="items"></div>
<h2>Utensils &amp; recipe icons</h2><div class="sheet" id="tools"></div>
<h2>Vessels (inline, animatable)</h2><div class="vsheet" id="vessels"></div>
<script src="../js/vessels.js"></script>
<script>
  const ITEMS = ['scoop','egg','pepperoni','cherry','case','bread','ham','strawberry','berry','cup',
                 'slice','cupcake','sandwich','pancake','tomato','cheese','mushroom','olive','basil',
                 'butter','lettuce','sprinkle','banana'];
  const TOOLS = ['rollingpin','spoon','whisk','knife','spatula',
                 'icon-pizza','icon-cupcakes','icon-sandwich','icon-smoothie','icon-pancakes'];
  const fig = n => `<figure><img src="../assets/art/${n}.svg" alt="${n}"><figcaption>${n}</figcaption></figure>`;
  items.innerHTML = ITEMS.map(fig).join('');
  tools.innerHTML = TOOLS.map(fig).join('');
  vessels.innerHTML = Object.entries(VESSELS).map(([k, v]) =>
    `<figure>${v}<figcaption>${k}</figcaption></figure>`).join('');
</script>
</body></html>
